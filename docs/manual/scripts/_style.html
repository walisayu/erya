<style>
  :root {
    /* 墨藍 × 朱砂：《漢書》刻本的色感，畫面示意圖仍用爾雅實際的終端配色 */
    --primary: #1F4E79;
    --primary-hover: #1A4268;
    --primary-deep: #12314F;
    --primary-soft: #E8EFF7;
    --primary-line: #C7D8EA;
    --teal: #9B4B3F;
    --teal-soft: #F6EBE9;
    --teal-line: #E6CCC7;
    --gold: #C08A2E;
    --gold-soft: #FBF3E3;
    --gold-line: #EDD9AE;
    --gold-ink: #7A5312;
    --success: #2E7D4F;
    --success-soft: #E8F2EB;
    --success-ink: #1E5C39;
    --warning: #E8943A;
    --warning-soft: #FDF1E3;
    --danger: #B33A3A;
    --danger-soft: #FBEDEC;
    --danger-line: #EFCFCC;
    --danger-ink: #8C2B2B;
    --purple: #6B5B95;
    --purple-soft: #EFECF6;
    --purple-line: #D6CFE6;
    --purple-ink: #4C3F72;

    --ink: #161C2E;
    --text: #3F485D;
    --soft: #667085;
    --muted: #98A2B3;
    --canvas: #E9EDF4;
    --surface: #FFFFFF;
    --surface-soft: #FAFBFD;
    --line: #E8ECF2;
    --line-strong: #D9E0E9;

    --radius-sm: 8px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --shadow-card: 0 2px 10px rgba(40, 55, 95, .055);
    --shadow-hover: 0 10px 26px rgba(40, 55, 95, .10);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    color: var(--text);
    background: var(--canvas);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
      "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    font-size: 16.5px;
    line-height: 1.85;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--primary-deep); }
  strong { color: var(--ink); font-weight: 700; }

  /* ── 版面 ───────────────────────────── */
  .layout {
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr);
    min-height: 100vh;
    transition: grid-template-columns .22s ease;
  }
  .layout.nav-collapsed { grid-template-columns: 0 minmax(0, 1fr); }
  .layout.nav-collapsed .sidebar { opacity: 0; pointer-events: none; }

  .side-toggle {
    position: fixed; top: 14px; left: 14px; z-index: 40;
    width: 36px; height: 36px; display: grid; place-items: center;
    color: #fff; background: rgba(14, 22, 38, .82);
    border: 1px solid rgba(255,255,255,.18); border-radius: 9px;
    cursor: pointer; font-size: 16px; line-height: 1;
  }
  .side-toggle:hover { background: rgba(14, 22, 38, .95); }

  /* ── 側欄 ───────────────────────────── */
  .sidebar {
    position: sticky; top: 0; height: 100vh; overflow: auto;
    padding: 24px 18px 40px; color: #C6D4EA;
    background:
      radial-gradient(circle at 16% 6%, rgba(31, 78, 121, .46), transparent 40%),
      linear-gradient(180deg, #18243E, #0E1626);
    transition: opacity .18s ease;
  }
  .brand { display: flex; gap: 12px; align-items: center; margin: 6px 0 18px; padding-left: 44px; }
  .brand-mark {
    display: grid; place-items: center; width: 42px; height: 42px; flex: none;
    color: #fff; font-weight: 800; font-size: 15px; border-radius: 12px;
    background: linear-gradient(135deg, #1F4E79, #9B4B3F);
    box-shadow: 0 8px 20px rgba(31, 78, 121, .38);
  }
  .brand strong { display: block; color: #fff; font-size: 15px; line-height: 1.4; }
  .brand span { display: block; color: #7E93B5; font-size: 12.5px; }

  .search-wrap { position: relative; margin: 10px 2px 6px; }
  .search-wrap input {
    width: 100%; padding: 10px 34px 10px 34px; color: #fff;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16);
    border-radius: 9px; font-size: 14.5px; font-family: inherit; outline: none;
  }
  .search-wrap input::placeholder { color: #7E93B5; }
  .search-wrap input:focus { border-color: rgba(47,128,232,.9); background: rgba(255,255,255,.12); }
  .search-ico { position: absolute; left: 11px; top: 9px; color: #7E93B5; font-size: 15px; }
  .search-kbd {
    position: absolute; right: 9px; top: 10px; color: #7E93B5;
    font-size: 11.5px; letter-spacing: .04em; pointer-events: none;
  }
  .search-stat { margin: 6px 4px 0; color: #8FA6C6; font-size: 12.5px; min-height: 18px; }
  .search-stat b { color: #D9A441; font-weight: 700; }
  .search-nav { display: inline-flex; gap: 4px; margin-left: 6px; }
  .search-nav button {
    padding: 0 6px; color: #C6D4EA; background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.14); border-radius: 5px;
    font-size: 11.5px; cursor: pointer; font-family: inherit;
  }
  .search-nav button:hover { background: rgba(255,255,255,.2); }

  .jump { margin: 8px 0 4px; padding: 8px; background: rgba(47,128,232,.14);
          border: 1px solid rgba(47,128,232,.3); border-radius: 9px; }
  .jump.hidden { display: none; }
  .jump-label { color: #8FA6C6; font-size: 11.5px; font-weight: 700; letter-spacing: .1em; margin: 0 4px 4px; }
  .jump a { display: block; padding: 5px 8px; color: #DCE7F7; border-radius: 6px;
            font-size: 13.5px; text-decoration: none; }
  .jump a:hover { background: rgba(255,255,255,.12); color: #fff; }
  .jump a i { font-style: normal; color: #D9A441; font-weight: 700; margin-right: 6px; }

  .toc-part {
    margin: 18px 8px 6px; color: #6E86AC; font-size: 11px;
    font-weight: 800; letter-spacing: .14em;
  }
  .toc { display: grid; gap: 2px; }
  .toc a {
    display: flex; gap: 8px; align-items: baseline; padding: 6px 9px;
    color: #AFC2DD; border-radius: 7px; font-size: 13.5px; line-height: 1.5;
    text-decoration: none; transition: .15s ease;
  }
  .toc a i { font-style: normal; color: #7E93B5; font-size: 12px; font-variant-numeric: tabular-nums; flex: none; width: 26px; }
  .toc a:hover { color: #fff; background: rgba(255,255,255,.09); }
  .toc a.current { color: #fff; background: rgba(47,128,232,.28); font-weight: 700; }
  .toc a.current i { color: #D9A441; }
  .toc a.pending { color: #7E93B5; }
  .toc a.pending::after { content: "草稿中"; margin-left: auto; color: #5D7196; font-size: 11px; }
  .toc a.hit-kw { box-shadow: inset 0 0 0 1px rgba(245,166,35,.55); }

  .sub-toc { display: grid; gap: 1px; margin: 2px 0 2px 26px; padding-left: 10px;
             border-left: 1px solid rgba(255,255,255,.14); }
  .sub-toc a { padding: 4px 8px; color: #96AAC9; font-size: 12.5px; }
  .sub-toc a.active { color: #fff; background: rgba(255,255,255,.12); }

  .side-note {
    margin-top: 22px; padding: 12px; color: #96AAC9; background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.08); border-radius: 10px; font-size: 12.5px; line-height: 1.7;
  }

  /* ── 主內容 ─────────────────────────── */
  main { min-width: 0; }
  .hero {
    position: relative; overflow: hidden; color: #fff;
    padding: 58px clamp(24px, 5vw, 70px) 46px;
    background: linear-gradient(118deg, #0A2430, #1F4E79 58%, #9B4B3F);
  }
  .hero::after {
    content: ""; position: absolute; width: 420px; height: 420px; right: -130px; top: -190px;
    border: 62px solid rgba(255,255,255,.08); border-radius: 50%;
  }
  .hero::before {
    content: ""; position: absolute; width: 220px; height: 220px; right: -30px; top: -100px;
    border: 24px solid rgba(245,166,35,.20); border-radius: 50%;
  }
  .eyebrow {
    display: inline-flex; gap: 8px; align-items: center; padding: 6px 12px;
    color: #EAF2FC; background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.24); border-radius: 999px;
    font-size: 12.5px; font-weight: 700; letter-spacing: .06em;
  }
  .hero h1 {
    max-width: 900px; margin: 18px 0 14px; font-weight: 800;
    font-size: clamp(28px, 4.2vw, 46px); line-height: 1.24; letter-spacing: .01em;
  }
  .hero h1 em { font-style: normal; color: #FFD98E; }
  .hero p { max-width: 780px; margin: 0; color: #DDEAFB; font-size: clamp(15px, 2vw, 17px); }
  .hero-meta { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 26px; }
  .hero-meta span {
    padding: 6px 11px; background: rgba(8, 24, 46, .30); border-radius: 8px;
    font-size: 12.5px; font-variant-numeric: tabular-nums;
  }

  .content { padding: 34px clamp(16px, 3vw, 46px) 80px; }
  section {
    scroll-margin-top: 18px; margin: 0 0 18px; padding: clamp(22px, 3.4vw, 38px);
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-card);
  }
  .sec-no {
    display: inline-block; padding: 2px 9px; color: #fff; background: var(--primary);
    border-radius: 6px; font-size: 12.5px; font-weight: 800;
    letter-spacing: .06em; font-variant-numeric: tabular-nums;
  }
  h2 { margin: 10px 0 6px; color: var(--ink); font-weight: 800;
       font-size: clamp(20px, 2.7vw, 27px); line-height: 1.35; }
  h3 { margin: 26px 0 6px; color: var(--ink); font-weight: 800; font-size: 17.5px; }
  .dek { margin: 0 0 18px; color: var(--soft); font-size: 14.5px; }
  p { margin: 10px 0 14px; max-width: 88ch; }
  section ul, section ol { max-width: 88ch; margin: 10px 0 16px; padding-left: 22px; }
  section li { margin-bottom: 7px; }
  section ul li::marker { color: var(--primary); }
  section ol li::marker { color: var(--primary); font-weight: 700; }

  .path {
    display: inline-block; padding: 1px 7px; color: var(--primary-deep);
    background: var(--primary-soft); border: 1px solid var(--primary-line);
    border-radius: 5px; font-size: .93em; white-space: nowrap;
  }
  .term { color: var(--ink); font-weight: 700; border-bottom: 2px solid var(--gold-line); }

  .callout {
    position: relative; margin: 18px 0; padding: 15px 18px 15px 20px; max-width: 92ch;
    background: var(--primary-soft); border: 1px solid var(--primary-line);
    border-radius: var(--radius-md);
  }
  .callout::before {
    content: ""; position: absolute; left: 0; top: 14px; bottom: 14px;
    width: 4px; background: var(--primary); border-radius: 0 4px 4px 0;
  }
  .callout p:last-child, .callout ul:last-child { margin-bottom: 0; }
  .callout p:first-child { margin-top: 0; }
  .callout .co-title { display: block; margin-bottom: 4px; color: var(--primary-deep); font-weight: 800; }
  .callout.warn { background: var(--danger-soft); border-color: var(--danger-line); }
  .callout.warn::before { background: var(--danger); }
  .callout.warn .co-title { color: var(--danger-ink); }
  .callout.tip { background: var(--gold-soft); border-color: var(--gold-line); }
  .callout.tip::before { background: var(--gold); }
  .callout.tip .co-title { color: var(--gold-ink); }
  .callout.ok { background: var(--success-soft); border-color: #C3DECD; }
  .callout.ok::before { background: var(--success); }
  .callout.ok .co-title { color: var(--success-ink); }

  figure { margin: 26px calc(-1 * clamp(10px, 1.8vw, 20px)); }
  .fig-frame {
    padding: 16px clamp(8px, 1.6vw, 20px); background: var(--surface-soft);
    border: 1px solid var(--line); border-radius: var(--radius-lg);
    overflow-x: auto;
  }
  /* 圖不縮小：viewBox 寬 960，min-width 鎖住 1:1，寧可橫向捲動也不讓字變小 */
  .fig-frame svg { display: block; width: 100%; min-width: 960px; height: auto; }
  figcaption { margin-top: 10px; color: var(--soft); font-size: 14px; line-height: 1.7; }
  figcaption b { color: var(--ink); }

  table { width: 100%; margin: 18px 0; border-collapse: collapse; font-size: 15px; }
  th, td { padding: 10px 12px; text-align: left; vertical-align: top;
           border-bottom: 1px solid var(--line); }
  thead th { color: var(--ink); background: var(--surface-soft); font-weight: 800;
             border-bottom: 2px solid var(--line-strong); }
  tbody tr:hover { background: #FBFCFE; }
  .tbl-wrap { overflow-x: auto; }

  .role-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; margin: 20px 0; }
  .role-card { padding: 18px; background: var(--surface-soft); border: 1px solid var(--line);
               border-top: 4px solid var(--primary); border-radius: var(--radius-md); }
  .role-card.mgr { border-top-color: var(--purple); }
  .role-card.hr { border-top-color: var(--teal); }
  .role-card h4 { margin: 0 0 2px; color: var(--ink); font-size: 17px; font-weight: 800; }
  .role-card .who { margin: 0 0 10px; color: var(--soft); font-size: 13.5px; }
  .role-card ul { margin: 0 0 10px; padding-left: 20px; font-size: 14.5px; }
  .role-card li { margin-bottom: 4px; }
  .role-card .go { color: var(--primary-deep); font-size: 13.5px; font-weight: 700; }

  .rule-list { counter-reset: rule; list-style: none; padding: 0; margin: 20px 0; max-width: 92ch; }
  .rule-list li {
    counter-increment: rule; position: relative; margin: 0 0 10px;
    padding: 14px 16px 14px 56px; background: var(--surface-soft);
    border: 1px solid var(--line); border-radius: var(--radius-md);
  }
  .rule-list li::before {
    content: counter(rule); position: absolute; left: 16px; top: 14px;
    display: grid; place-items: center; width: 28px; height: 28px;
    color: #fff; background: var(--primary); border-radius: 8px;
    font-size: 14px; font-weight: 800;
  }
  .rule-list b { display: block; color: var(--ink); font-size: 16px; }

  .pager { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between;
           margin-top: 22px; padding: 0 4px; }
  .pager a {
    flex: 1 1 260px; padding: 14px 18px; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius-md);
    box-shadow: var(--shadow-card); text-decoration: none; transition: .16s ease;
  }
  .pager a:hover { border-color: var(--primary-line); box-shadow: var(--shadow-hover); }
  .pager span { display: block; color: var(--soft); font-size: 12.5px; }
  .pager b { color: var(--ink); font-size: 16px; }
  .pager .next { text-align: right; }

  mark.hit { background: #FFE9B8; color: inherit; border-radius: 3px; padding: 0 1px; }
  mark.hit.cur { background: var(--gold); color: #fff; box-shadow: 0 0 0 3px rgba(245,166,35,.3); }
  .svg-hit { fill: #B4530B !important; font-weight: 800 !important; }


  /* ── 畫面 Mockup：用 HTML 重畫系統畫面（不是截圖，圖上的字可搜尋、可選取） ── */
  .mock-scroll { overflow-x: auto; padding-bottom: 4px; }
  .mock { position: relative; min-width: 700px; background: var(--surface); border: 1px solid var(--line-strong);
          border-radius: var(--radius-lg); box-shadow: var(--shadow-card); overflow: hidden; font-size: 14px; line-height: 1.55; }
  .mock * { box-sizing: border-box; }
  .mock-app { display: grid; grid-template-columns: 210px minmax(0, 1fr); }
  .mock-side { position: relative; padding: 12px 10px; color: #C6D4EA; background: linear-gradient(180deg, #18243E, #0E1626); }
  .mock-brand { display: flex; gap: 8px; align-items: center; padding: 4px 6px 12px; color: #fff; font-weight: 700; }
  .mock-logo { display: grid; place-items: center; width: 28px; height: 28px; flex: none; color: #fff;
               background: linear-gradient(135deg, #1F4E79, #9B4B3F); border-radius: 8px; font-size: 12px; font-weight: 800; }
  .mock-field { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; color: var(--muted);
                background: #fff; border: 1px solid var(--line-strong); border-radius: 8px; font-size: 13.5px; }
  .mock-side .mock-field { color: #8FA6C6; background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.16); }
  .mock-menu { margin-top: 10px; display: grid; gap: 2px; }
  .mock-mi { padding: 6px 10px; border-radius: 7px; font-size: 13.5px; }
  .mock-mi.grp { color: #fff; font-weight: 700; }
  .mock-mi.sub { padding-left: 24px; color: #AFC2DD; }
  .mock-mi.cur { color: #fff; background: rgba(47,128,232,.34); font-weight: 700; }
  .mock-sfoot { margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.14); font-size: 13px; }
  .mock-sfoot .u { margin-top: 8px; color: #fff; }
  .mock-sfoot .u small { display: block; color: #7E93B5; font-size: 11.5px; font-weight: 400; }
  .mock-main { display: flex; flex-direction: column; min-width: 0; background: #EEF1F6; }
  .mock-tabs { position: relative; display: flex; gap: 6px; align-items: center; padding: 8px 10px;
               background: #fff; border-bottom: 1px solid var(--line); }
  .mock-tab { padding: 5px 10px; color: var(--soft); background: var(--surface-soft); border: 1px solid var(--line);
              border-radius: 7px; font-size: 13px; white-space: nowrap; }
  .mock-tab.on { color: var(--primary-deep); background: var(--primary-soft); border-color: var(--primary-line); font-weight: 700; }
  .mock-tab .x { color: var(--muted); margin-left: 5px; }
  .mock-tab .pin { color: var(--primary); margin-right: 4px; }
  .mock-closeall { margin-left: auto; color: var(--soft); font-size: 12.5px; }
  .mock-body { position: relative; display: flex; min-width: 0; }
  .mock-ws { position: relative; flex: 1; min-width: 0; margin: 12px; padding: 14px; background: #fff;
             border: 1px solid var(--line); border-radius: 10px; }
  .mock-toolbar { position: relative; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .mock-btn { display: inline-flex; gap: 5px; align-items: center; height: 32px; padding: 0 12px;
              border: 1px solid transparent; border-radius: 8px; font-size: 13.5px; white-space: nowrap; }
  .mock-btn.b-search { color: var(--primary-deep); background: var(--primary-soft); border-color: var(--primary-line); }
  .mock-btn.b-save { color: #fff; background: var(--primary); }
  .mock-btn.b-ok { color: #fff; background: var(--success); }
  .mock-btn.b-cancel { color: var(--text); background: #fff; border-color: var(--line-strong); }
  .mock-btn.b-void { color: var(--danger-ink); background: var(--danger-soft); border-color: var(--danger-line); }
  .mock-btn.b-del { color: #fff; background: var(--danger); }
  .mock-dot { display: inline-grid; place-items: center; min-width: 18px; height: 18px; margin-left: 4px; padding: 0 5px;
              color: #fff; background: var(--danger); border-radius: 9px; font-size: 11.5px; font-weight: 700; }
  .mock-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .mock-table th, .mock-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .mock-table th { color: var(--ink); background: #F5F8FC; font-weight: 700; }
  .mock-pager { margin-top: 10px; color: var(--soft); font-size: 13px; }
  .mock-num { position: absolute; z-index: 3; display: grid; place-items: center; width: 22px; height: 22px;
              color: #fff; background: var(--gold); border-radius: 50%; box-shadow: 0 0 0 2px #fff;
              font-size: 12.5px; font-weight: 800; }
  .mock-drawer { position: relative; width: 290px; flex: none; padding: 14px; background: #fff;
                 border-left: 1px solid var(--line-strong); box-shadow: -10px 0 24px rgba(40,55,95,.07); }
  .mock-dtitle { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; color: var(--ink); font-weight: 700; }
  .mock-dsum { margin-bottom: 10px; color: var(--soft); font-size: 12.5px; }
  .mock-lbl { margin: 10px 0 4px; color: var(--soft); font-size: 12.5px; }
  .mock-dfoot { display: flex; gap: 8px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
  .mock-login { display: grid; place-items: center; padding: 30px; background: #F4F6FA; }
  .login-card { width: 330px; padding: 26px; background: #fff; border: 1px solid var(--line);
                border-radius: 18px; box-shadow: var(--shadow-hover); text-align: center; }
  .login-card .l-logo { display:inline-block; padding:6px 18px; color: var(--soft); background:var(--surface-soft); border:1px dashed var(--line-strong); border-radius:8px; font-size: 15px; font-weight: 700; letter-spacing: .06em; }
  .login-card .l-title { margin-top: 14px; color: var(--ink); font-size: 17px; font-weight: 700; }
  .login-card .l-sub { margin-bottom: 14px; color: var(--soft); font-size: 13px; }
  .login-card .mock-field { margin-top: 10px; }
  .login-card .l-btn { width: 100%; height: 38px; margin-top: 16px; justify-content: center; font-size: 15px; font-weight: 700; }
  .login-card .l-ver { margin-top: 14px; color: var(--muted); font-size: 12px; }
  .btn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin: 20px 0; }
  .btn-cell { padding: 14px; background: var(--surface-soft); border: 1px solid var(--line); border-radius: var(--radius-md); }
  .btn-cell .mock-btn { margin-bottom: 8px; }
  .btn-cell p { margin: 0; color: var(--soft); font-size: 13.5px; line-height: 1.65; max-width: none; }
  .btn-cell b { display: block; color: var(--ink); font-size: 14px; }
  .mock-row { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
