# Original Erya shortcuts retained for users whose terminal can report modified keys.
name = "Erya Classic"

[bindings]
new_tab = "Ctrl+N"
open_file = "Alt+O"
compare_file = "F4"
close_tab = "Ctrl+F4"
next_tab = ["Ctrl+Tab", "Ctrl+PageDown"]
previous_tab = ["Ctrl+Shift+Tab", "Ctrl+PageUp"]
save = "Ctrl+S"
save_as = "Ctrl+O"
quit = "Ctrl+X"
search = ["Ctrl+W", "Ctrl+F"]
go_to_position = "Ctrl+G"
replace = "Ctrl+H"
toggle_rectangular_selection = "Alt+B"
toggle_line_wrap = "Alt+Z"
toggle_hex_view = "Alt+H"
set_paragraph_width = "Alt+M"
reflow_paragraph = "Alt+Q"
fill_rectangle = "Alt+F"
move_rectangle_left = "Alt+Shift+Left"
move_rectangle_right = "Alt+Shift+Right"
move_rectangle_up = "Alt+Shift+Up"
move_rectangle_down = "Alt+Shift+Down"
capture_phrase = "F9"
insert_phrase = "F10"
load_phrases = "Shift+F9"
save_phrases = "Shift+F10"
toggle_macro_recording = "Ctrl+F2"
run_macro = "Ctrl+F3"
load_macro = "Ctrl+Shift+F2"
save_macro = "Ctrl+Shift+F3"
cut_line = "Ctrl+K"
undo = "Ctrl+Z"
redo = "Ctrl+R"
format_document = "Ctrl+Shift+F"
paste = ["Ctrl+V", "Shift+Insert"]
delete_line = "Ctrl+Y"
line_start = "Ctrl+A"
line_end = "Ctrl+E"
cursor_position = "Ctrl+C"
cut = "Shift+Delete"
copy = "Ctrl+Insert"
toggle_insert = ["Insert", "Alt+I"]
find_next = "F3"
replace_next = "F5"
replace_all = "F6"
convert_encoding = "F7"
toggle_line_ending = "F8"
open_settings = "F2"
