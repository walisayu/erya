name = "VSCode(macOS)"

[bindings]
new_tab = "Cmd+N"
open_file = "Cmd+O"
close_tab = "Cmd+W"
next_tab = "Ctrl+Tab"
previous_tab = "Ctrl+Shift+Tab"
save = "Cmd+S"
save_as = "Cmd+Shift+S"
quit = "Cmd+Q"
search = "Cmd+F"
replace = "Cmd+Alt+F"
undo = "Cmd+Z"
redo = "Cmd+Shift+Z"
format_document = "Alt+Shift+F"
paste = "Cmd+V"
cut = "Cmd+X"
copy = "Cmd+C"
open_settings = "Cmd+,"
