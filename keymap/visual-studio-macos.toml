name = "Visual Studio(macOS)"

[bindings]
new_tab = "Cmd+N"
open_file = "Cmd+O"
close_tab = "Cmd+W"
next_tab = "Cmd+Alt+Right"
previous_tab = "Cmd+Alt+Left"
save = "Cmd+S"
save_as = "Cmd+Shift+S"
quit = "Cmd+Q"
search = "Cmd+F"
go_to_position = "Cmd+L"
replace = "Cmd+Alt+F"
undo = "Cmd+Z"
redo = "Cmd+Shift+Z"
format_document = "Cmd+I"
paste = "Cmd+V"
cut = "Cmd+X"
copy = "Cmd+C"
open_settings = "Cmd+,"
