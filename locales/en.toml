help = """Erya — a Rust rebirth of the DOS Han Shu word-processing system.
Rebuilt through specification-driven, documentation-first development.

Usage:
  erya [options] [file ...]

Options:
  -h, --help       Show this help
  -V, --version    Show version
      --languages  List languages found in the translation directory
      --keymap <file>           Load custom key bindings
      --print-default-keymap    Print the complete default keymap

Environment:
  ERYA_LANG         Interface language code
  ERYA_LOCALES_DIR  Translation directory (defaults to locales/)
  ERYA_KEYMAP       Custom keymap file path
  ERYA_KEYMAPS_DIR  Keymap profile directory used by System Settings (defaults to keymap/)

Common keys:
  Ctrl+N  New tab    Ctrl+O       Open file
  F4      Compare    F11          Close tab
  F9      Previous   F10          Next tab
  Ctrl+S  Save       F12          Save as
  Ctrl+W  Search     F3           Find next
  Ctrl+G  Go to      Ctrl+R       Replace
  Ctrl+Z  Undo       Ctrl+Y       Redo
  Ctrl+T  Format     Ctrl+L       Line wrap
  Ctrl+K  Cut line   Ctrl+C       Copy
  Ctrl+V  Paste      Ctrl+X       Exit"""

