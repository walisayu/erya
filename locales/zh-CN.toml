help = """尔雅 Erya — 尔，近也；雅，正也。DOS《汉书》文书系统的 Rust 重生。
以规格驱动、文档先行的方式重建三十年前的中文文书系统。

用法：
  erya [选项] [文件 ...]

选项：
  -h, --help       显示此帮助
  -V, --version    显示版本
      --languages  列出翻译目录中的可用语言
      --keymap <文件>          加载自定义快捷键设置
      --print-default-keymap   输出完整默认快捷键设置

环境变量：
  ERYA_LANG         界面语言代码
  ERYA_LOCALES_DIR  翻译文件目录（默认为 locales/）
  ERYA_KEYMAP       自定义快捷键设置文件路径
  ERYA_KEYMAPS_DIR  系统设置读取的按键配置目录（默认为 keymap/）

常用按键：
  Ctrl+N  新建页签    Ctrl+O       打开文件
  F4      比较文件    F11          关闭页签
  F9      上一页签    F10          下一页签
  Ctrl+S  保存        F12          另存为
  Ctrl+W  搜索      F3           查找下一个
  Ctrl+G  跳至行／列 Ctrl+R       替换
  Ctrl+Z  撤销        Ctrl+Y       重做
  Ctrl+T  格式化文档  Ctrl+L       自动换行
  Ctrl+K  剪切当前行  Ctrl+C       复制
  Ctrl+V  粘贴        Ctrl+X       退出"""

