help = """爾雅 Erya — DOS版『漢書』文書システムをRustで蘇らせるプロジェクト。
仕様駆動・ドキュメント先行で30年前の中国語文書環境を再構築します。

使い方：
  erya [オプション] [ファイル ...]

オプション：
  -h, --help       このヘルプを表示
  -V, --version    バージョンを表示
      --languages  翻訳ディレクトリ内の利用可能な言語を一覧表示
      --keymap <ファイル>       カスタムキーバインドを読み込む
      --print-default-keymap    完全な既定キーマップを出力

環境変数：
  ERYA_LANG         インターフェースの言語コード
  ERYA_LOCALES_DIR  翻訳ファイルのディレクトリ（既定：locales/）
  ERYA_KEYMAP       カスタムキーマップファイルのパス
  ERYA_KEYMAPS_DIR  システム設定で読むキーマップディレクトリ（既定：keymap/）

主なキー：
  Ctrl+N  新規タブ    Ctrl+O       ファイルを開く
  F4      ファイル比較 F11          タブを閉じる
  F9      前のタブ    F10          次のタブ
  Ctrl+S  保存        F12          名前を付けて保存
  Ctrl+W  検索      F3           次を検索
  Ctrl+G  行／列へ移動 Ctrl+R       置換
  Ctrl+Z  元に戻す    Ctrl+Y       やり直し
  Ctrl+T  文書を整形  Ctrl+L       折り返し
  Ctrl+K  行を切取    Ctrl+C       コピー
  Ctrl+V  貼り付け    Ctrl+X       終了"""

