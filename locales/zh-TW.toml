help = """爾雅 Erya — 爾，近也；雅，正也。DOS《漢書》文書系統的 Rust 重生。
以規格驅動、文件先行的方式重建三十年前的中文文書系統。

用法：
  erya [選項] [檔案 ...]

選項：
  -h, --help       顯示這份說明
  -V, --version    顯示版本
      --languages  列出翻譯目錄內可用的語言
      --keymap <檔案>          載入自訂快捷鍵設定
      --print-default-keymap   輸出完整預設快捷鍵設定

環境變數：
  ERYA_LANG         介面語言代碼
  ERYA_LOCALES_DIR  翻譯檔目錄（預設為 locales/）
  ERYA_KEYMAP       自訂快捷鍵設定檔路徑
  ERYA_KEYMAPS_DIR  系統設定讀取的按鍵配置目錄（預設為 keymap/）

常用按鍵：
  Ctrl+N  新增頁籤    Ctrl+O       開啟檔案
  F4      比對檔案    F11          關閉頁籤
  F9      上一頁籤    F10          下一頁籤
  Ctrl+S  儲存        F12          另存新檔
  Ctrl+W  搜尋        F3           尋找下一個
  Ctrl+G  跳至行／欄  Ctrl+R       取代
  Ctrl+Z  復原        Ctrl+Y       重做
  Ctrl+T  格式化文件  Ctrl+L       自動換行
  Ctrl+K  剪下目前行  Ctrl+C       複製
  Ctrl+V  貼上        Ctrl+X       離開"""

