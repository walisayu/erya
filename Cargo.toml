[package]
name = "erya"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Erya is a Rust rebirth of the DOS Han Shu word-processing system, rebuilt through specification-driven, documentation-first development."
license = "MPL-2.0"
readme = "README.md"
homepage = "https://erya.walisayu.com"
repository = "https://github.com/walisayu/erya"
keywords = ["terminal", "editor", "tui", "unicode", "text-editor"]
categories = ["command-line-utilities", "text-editors"]
include = [
    "/src/**",
    "/tests/**",
    "/locales/**",
    "/keymap/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/README.zh-TW.md",
    "/README.ja.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/docs/BUILD_ENVIRONMENT.md",
]

[dependencies]
atomic-write-file = "0.3.1"
chardetng = "0.1.17"
crossterm = "0.29.0"
encoding_rs = "0.8.35"
pretty_yaml = "0.5.0"
ropey = "1.6.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
taplo = { version = "0.14.0", default-features = false }
toml = "0.8.23"
two-face = { version = "0.5.1", default-features = false, features = ["syntect-default-fancy"] }
unicode-width = "0.2.2"
unicode-segmentation = "1.13"

[dev-dependencies]
portable-pty = "0.9"

[profile.release]
codegen-units = 1
lto = true
strip = true
